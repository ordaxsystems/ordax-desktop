name: Desktop Source Contracts
on:
  push:
    branches: [main]
    # Documentation and compatibility-only test changes cannot alter NSIS bytes.
    paths-ignore: &nonproduct_files
      - '**/*.md'
      - 'ci/**'
      - '.github/workflows/desktop-cross-version-proof.yml'
  pull_request:
    paths-ignore: *nonproduct_files
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-source:
    name: Windows Electron and upstream ownership contracts
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      installer_required: ${{ steps.impact.outputs.required }}
    steps:
      - name: Checkout Desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify test-only impact before NSIS
        id: impact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Always build on manual dispatch, unknown history, or changed product bytes.
          # Only suites run by npm test below can skip NSIS; other tests need the full job.
          $required = $true
          if ($env:EVENT_NAME -in @('pull_request', 'push') -and
              $env:BASE_SHA -cmatch '^[a-f0-9]{40}$' -and
              $env:BASE_SHA -cne ('0' * 40) -and
              $env:HEAD_SHA -cmatch '^[a-f0-9]{40}$') {
            $changed = @(& git diff --name-only --no-renames $env:BASE_SHA $env:HEAD_SHA)
            if ($LASTEXITCODE -eq 0 -and $changed.Count -gt 0) {
              $nonTest = @($changed | Where-Object { $_ -cnotmatch '^(standalone-stage|local-dev|window-layout)\.test\.cjs$' })
              # Changes confined to the source gate cannot change installer bytes.
              # Compare the exact reusable installer job against the base commit;
              # any change there (or unreadable base) still requires NSIS.
              if ($nonTest.Count -eq 1 -and $nonTest[0] -ceq '.github/workflows/desktop-source.yml') {
                $baseline = @(& git show "${env:BASE_SHA}:.github/workflows/desktop-source.yml" 2>$null)
                if ($LASTEXITCODE -eq 0 -and $baseline.Count -gt 0) {
                  $block = '(?ms)^  windows-installer:\s*\r?\n.*\z'
                  $oldJob = [regex]::Match(($baseline -join "`n"), $block)
                  $newJob = [regex]::Match((Get-Content .github/workflows/desktop-source.yml -Raw), $block)
                  if ($oldJob.Success -and $newJob.Success -and
                      $oldJob.Value.Replace("`r`n", "`n").TrimEnd() -ceq $newJob.Value.Replace("`r`n", "`n").TrimEnd()) {
                    $nonTest = @()
                  }
                }
              }
              $required = $nonTest.Count -gt 0
            }
          }
          "required=$($required.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "DESKTOP_NSIS_REQUIRED=$($required.ToString().ToUpperInvariant())"
      - name: Read source pin
        id: origin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content docs/source-import.json -Raw | ConvertFrom-Json
          if ($r.source_repository -cne 'ordaxsystems/ordax-os' -or
              $r.source_commit -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Invalid canonical OS import receipt'
          }
          "os_sha=$($r.source_commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Checkout upstream OS contracts by exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-os
          ref: ${{ steps.origin.outputs.os_sha }}
          path: .deps/ordax-os
          sparse-checkout: |
            docs/contracts
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prove import and canonical OS/Surface boundaries
        shell: pwsh
        env:
          ORDAX_DESKTOP_OS_CHECKOUT: ${{ github.workspace }}\.deps\ordax-os
        run: |
          node tools/verify-import.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop import or OS owner boundary failed' }
      - name: Verify isolated Windows Electron source syntax and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($source in @(Get-ChildItem -Path . -File -Recurse -Include *.cjs,*.mjs |
              Where-Object { $_.FullName -notmatch '[\\/]\.deps[\\/]' })) {
            & node --check $source.FullName
            if ($LASTEXITCODE -ne 0) { throw "Desktop JS parse failed: $($source.Name)" }
          }
          & npm test
          if ($LASTEXITCODE -ne 0) { throw 'Detached Windows source regression failed' }
  # One compiler and one NSIS gate for product-affecting changes only.
  # Test-only changes still pass source contracts but do not rebuild identical
  # Electron/Native bytes. Unknown impact and manual dispatch fail closed.
  windows-installer:
    name: Canonical Windows installer (detached Desktop + OS)
    needs: windows-source
    if: needs.windows-source.outputs.installer_required == 'true'
    uses: ordaxsystems/ordax-os/.github/workflows/windows-desktop-dev.yml@3e7c907b11199c5a7e55f54df57268836f0c3eb5
    with:
      os_sha: 3e7c907b11199c5a7e55f54df57268836f0c3eb5
      desktop_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
