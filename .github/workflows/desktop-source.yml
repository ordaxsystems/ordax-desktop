name: Desktop Source Contracts
on:
  push:
    branches: [main]
    # Documentation and compatibility-only test changes cannot alter NSIS bytes.
    paths-ignore: &nonproduct_files
      - '**/*.md'
      # Cross-version proof is tested by its own workflow.
      # The Dev shell delta below must be checked by this source gate.
      - 'ci/download-cross-version-artifacts.cjs'
      - 'ci/windows-cross-version-smoke.ps1'
      - '.github/workflows/desktop-cross-version-proof.yml'
  pull_request:
    paths-ignore: *nonproduct_files
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-source:
    name: Windows Electron and upstream ownership contracts
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      installer_required: ${{ steps.impact.outputs.required }}
    steps:
      - name: Checkout Desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify test-only impact before NSIS
        id: impact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Always build on manual dispatch, unknown history, or changed product bytes.
          # Only verified test and Dev-only delta files can skip NSIS;
          # all packaged product changes still require the installer job.
          $required = $true
          if ($env:EVENT_NAME -in @('pull_request', 'push') -and
              $env:BASE_SHA -cmatch '^[a-f0-9]{40}$' -and
              $env:BASE_SHA -cne ('0' * 40) -and
              $env:HEAD_SHA -cmatch '^[a-f0-9]{40}$') {
            $changed = @(& git diff --name-only --no-renames $env:BASE_SHA $env:HEAD_SHA)
            if ($LASTEXITCODE -eq 0 -and $changed.Count -gt 0) {
              # Markdown is excluded from the explicit build.files allowlist in package.json;
              # a documentation update alongside Dev-only code must not trigger NSIS.
              $nonTest = @($changed | Where-Object {
                $_ -cnotmatch '\.md$' -and
                $_ -cnotmatch '^(standalone-stage|local-dev|window-layout|host-recovery|host-startup|native-grant-frame|runtime)\.test\.cjs$' -and
                $_ -cnotmatch '^ci/dev-shell-delta(?:\.test)?\.cjs$'
              })
              # Changes confined to the source gate cannot change installer bytes.
              # Compare the exact reusable installer job against the base commit;
              # any change there (or unreadable base) still requires NSIS.
              if ($nonTest.Count -eq 1 -and $nonTest[0] -ceq '.github/workflows/desktop-source.yml') {
                $baseline = @(& git show "${env:BASE_SHA}:.github/workflows/desktop-source.yml" 2>$null)
                if ($LASTEXITCODE -eq 0 -and $baseline.Count -gt 0) {
                  $block = '(?ms)^  windows-installer:\s*\r?\n.*\z'
                  $oldJob = [regex]::Match(($baseline -join "`n"), $block)
                  $newJob = [regex]::Match((Get-Content .github/workflows/desktop-source.yml -Raw), $block)
                  if ($oldJob.Success -and $newJob.Success -and
                      $oldJob.Value.Replace("`r`n", "`n").TrimEnd() -ceq $newJob.Value.Replace("`r`n", "`n").TrimEnd()) {
                    $nonTest = @()
                  }
                }
              }
              $required = $nonTest.Count -gt 0
            }
          }
          # The exact alpha.21 bytes already passed this NSIS and isolated
          # installation gate in run 42244971203. Reuse is allowed ONLY when
          # all changed files since its release commit are CI policy itself;
          # an independent verified-release step below must still succeed.
          $releasedCommit = 'e616595892fc27b9cdce495ea5290b088c933136'
          $reuse = $false
          if ($env:EVENT_NAME -in @('pull_request','push') -and
              $env:HEAD_SHA -cmatch '^[a-f0-9]{40}$') {
            $sinceRelease = @(& git diff --name-only --no-renames $releasedCommit $env:HEAD_SHA)
            if ($LASTEXITCODE -eq 0 -and $sinceRelease.Count -eq 1 -and
                $sinceRelease[0] -ceq '.github/workflows/desktop-source.yml') {
              $reuse = $true
              $required = $false
            }
          }
          "reuse=$($reuse.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "required=$($required.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "DESKTOP_NSIS_REQUIRED=$($required.ToString().ToUpperInvariant())"
      - name: Read source pin
        id: origin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content docs/source-import.json -Raw | ConvertFrom-Json
          if ($r.source_repository -cne 'ordaxsystems/ordax-os' -or
              $r.source_commit -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Invalid canonical OS import receipt'
          }
          "os_sha=$($r.source_commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Checkout upstream OS contracts by exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-os
          ref: ${{ steps.origin.outputs.os_sha }}
          path: .deps/ordax-os
          sparse-checkout: |
            docs/contracts
            docs/evidence
            system/contracts
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prove import and canonical OS/Surface boundaries
        shell: pwsh
        env:
          ORDAX_DESKTOP_OS_CHECKOUT: ${{ github.workspace }}\.deps\ordax-os
        run: |
          node tools/verify-import.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop import or OS owner boundary failed' }
      - name: Verify isolated Windows Electron source syntax and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($source in @(Get-ChildItem -Path . -File -Recurse -Include *.cjs,*.mjs |
              Where-Object { $_.FullName -notmatch '[\\/]\.deps[\\/]' })) {
            & node --check $source.FullName
            if ($LASTEXITCODE -ne 0) { throw "Desktop JS parse failed: $($source.Name)" }
          }
          & npm test
          if ($LASTEXITCODE -ne 0) { throw 'Detached Windows source regression failed' }
          & node --test ci/dev-shell-delta.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Dev shell delta regression failed' }
      - name: Attest already-published alpha.21 NSIS (no rebuild)
        if: steps.impact.outputs.reuse == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPARE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseSha = 'e616595892fc27b9cdce495ea5290b088c933136'
          $tag = 'desktop-dev-v0.1.0-alpha.21-e616595892fc'
          $repo = $env:GITHUB_REPOSITORY
          if ($repo -cne 'ordaxsystems/ordax-desktop') { throw 'Incorrect release owner' }
          $changed = @(& git diff --name-only --no-renames $releaseSha $env:RELEASE_COMPARE_HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or
              $changed[0] -cne '.github/workflows/desktop-source.yml') {
            throw 'Packaged Desktop source differs from the published NSIS'
          }
          $workflow = Get-Content '.github/workflows/desktop-source.yml' -Raw
          if (-not $workflow.Contains('      os_sha: 3bafa3d1e25f644cf089cce1444e1f85c53c2c4b') -or
              -not $workflow.Contains('      publish_dev_release: true')) {
            throw 'Installer OS or release mode changed after publication'
          }
          $release = (& gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $release.id -ne 436689504 -or
              $release.draft -or -not $release.prerelease -or
              $release.target_commitish -cne $releaseSha) {
            throw 'Canonical published Dev Release identity mismatch'
          }
          $ref = (& gh api "repos/$repo/git/ref/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $ref.object.type -cne 'commit' -or
              $ref.object.sha -cne $releaseSha) { throw 'Published tag source mismatch' }
          $expected = @{
            'OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe' = 'sha256:5a665760be67f7963bdbf760e84c3c4432a693455e30fd8d51589c3df0c0ccce'
            'OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe.sha256' = 'sha256:446241b3419161a79075a6dd05516c64738012964e56d46f9b3e0f8f60dcb650'
            'OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe.provenance.json' = 'sha256:7d71689836304e02037fa4a806507efb61b394b9a2a4b421d96ccaa9312887a0'
          }
          if (@($release.assets).Count -ne 3) { throw 'Unexpected Dev Release asset inventory' }
          foreach ($asset in @($release.assets)) {
            if (-not $expected.ContainsKey($asset.name) -or
                $asset.state -cne 'uploaded' -or
                $asset.digest -cne $expected[$asset.name]) {
              throw "Untrusted Release asset: $($asset.name)"
            }
          }
          $exe = @($release.assets | Where-Object { $_.name -ceq 'OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe' })
          if ($exe.Count -ne 1 -or $exe[0].size -ne 680363736) { throw 'Installer size mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'ordax-verified-dev-release'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          & gh release download $tag -R $repo --dir $dir --pattern '*.sha256' --pattern '*.provenance.json'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download release proof files' }
          $checksum = Get-Item (Join-Path $dir 'OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe.sha256')
          $provenanceFile = Get-Item (Join-Path $dir 'OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe.provenance.json')
          if (('sha256:' + (Get-FileHash $checksum.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) -cne $expected[$checksum.Name] -or
              ('sha256:' + (Get-FileHash $provenanceFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) -cne $expected[$provenanceFile.Name]) {
            throw 'Downloaded release proof digest mismatch'
          }
          if ((Get-Content $checksum.FullName -Raw).Trim() -cne ('5a665760be67f7963bdbf760e84c3c4432a693455e30fd8d51589c3df0c0ccce  OrdaX-OS-Desktop-Dev-0.1.0-alpha.21-x64.exe')) {
            throw 'Installer checksum file mismatch'
          }
          $p = Get-Content $provenanceFile.FullName -Raw | ConvertFrom-Json
          if ($p.desktop_source_commit -cne $releaseSha -or $p.os_source_commit -cne '3bafa3d1e25f644cf089cce1444e1f85c53c2c4b' -or
              $p.surface_source_commit -cne 'fb0092b1e2139741a456340ad56854338b671186' -or $p.sha256 -cne '5a665760be67f7963bdbf760e84c3c4432a693455e30fd8d51589c3df0c0ccce' -or
              $p.size_bytes -ne 680363736 -or $p.unsigned -ne $true -or
              $p.channel -cne 'development') { throw 'Runtime provenance attestation failed' }
          Write-Output 'ORDAX_EXISTING_NSIS_RELEASE_ATTESTATION=PASS'
          Write-Output "VERIFIED_NSIS_SOURCE=$releaseSha RELEASE=$($release.html_url)"
  # One compiler and one NSIS gate for product-affecting changes only.
  # Test-only changes still pass source contracts but do not rebuild identical
  # Electron/Native bytes. Unknown impact and manual dispatch fail closed.
  windows-installer:
    name: Canonical Windows installer (detached Desktop + OS)
    needs: windows-source
    if: needs.windows-source.outputs.installer_required == 'true'
    uses: ordaxsystems/ordax-os/.github/workflows/windows-desktop-dev.yml@1c83a70813957d865b13e95790f2e16b0293bfb1
    with:
      os_sha: 3bafa3d1e25f644cf089cce1444e1f85c53c2c4b
      desktop_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      # The pinned OS publisher creates a draft and then queries it by tag;
      # GitHub returns 404 for that draft. Keep the real NSIS + Windows smoke
      # gate, but fail closed on publication until its canonical owner fixes it.
      # Do not create duplicate draft releases on PR or main pushes.
      publish_dev_release: false
    permissions:
      # Required by the pinned reusable OS workflow, even with publish disabled.
      contents: write
