name: Desktop Source Contracts
on:
  push:
    branches: [main]
    # Documentation and compatibility-only test changes cannot alter NSIS bytes.
    paths-ignore: &nonproduct_files
      - '**/*.md'
      # Cross-version proof is tested by its own workflow.
      # The Dev shell delta below must be checked by this source gate.
      - 'ci/download-cross-version-artifacts.cjs'
      - 'ci/windows-cross-version-smoke.ps1'
      - '.github/workflows/desktop-cross-version-proof.yml'
  pull_request:
    # Drafts validate source without recompiling NSIS on every synchronization.
    # Moving the PR to Ready explicitly re-runs the full installer gate.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *nonproduct_files
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-source:
    name: Windows Electron and upstream ownership contracts
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      installer_required: ${{ steps.impact.outputs.required }}
      pr_nsis_required: ${{ steps.impact.outputs.pr_nsis_required }}
    steps:
      - name: Checkout Desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify exact source impact before NSIS
        id: impact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The versioned classifier reads package.json as its sole source
          # list. Unknown history or impact always requires the NSIS gate.
          $decision = @(& node ci/desktop-build-impact.cjs)
          if ($LASTEXITCODE -ne 0 -or $decision.Count -ne 2 -or
              $decision[0] -cnotmatch '^required=(true|false)$' -or
              $decision[1] -cnotmatch '^pr_nsis_required=(true|false)$') {
            throw 'Untrusted Desktop build impact classification'
          }
          $decision | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $decision | ForEach-Object { Write-Output "DESKTOP_CI_IMPACT $_" }
      - name: Read source pin
        id: origin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content docs/source-import.json -Raw | ConvertFrom-Json
          if ($r.source_repository -cne 'ordaxsystems/ordax-os' -or
              $r.source_commit -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Invalid canonical OS import receipt'
          }
          "os_sha=$($r.source_commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Checkout upstream OS contracts by exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-os
          ref: ${{ steps.origin.outputs.os_sha }}
          path: .deps/ordax-os
          sparse-checkout: |
            docs/contracts
            docs/evidence
            system/contracts
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prove import and canonical OS/Surface boundaries
        shell: pwsh
        env:
          ORDAX_DESKTOP_OS_CHECKOUT: ${{ github.workspace }}\.deps\ordax-os
        run: |
          node tools/verify-import.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop import or OS owner boundary failed' }
      - name: Verify isolated Windows Electron source syntax and tests
        shell: pwsh
        env:
          # Tests import the OS-owned distribution contract; the verified
          # sparse checkout above is the only CI authority for that contract.
          ORDAX_DESKTOP_OS_CHECKOUT: ${{ github.workspace }}\.deps\ordax-os
        run: |
          $ErrorActionPreference = 'Stop'
          # Check only versioned Desktop sources, not the OS checkout,
          # caches, generated outputs, or installed node_modules.
          $sources = @(& git ls-files -- '*.cjs' '*.mjs')
          if ($LASTEXITCODE -ne 0 -or $sources.Count -eq 0) {
            throw 'Cannot enumerate versioned Desktop JS sources'
          }
          foreach ($source in $sources) {
            & node --check (Join-Path $PWD.Path $source)
            if ($LASTEXITCODE -ne 0) { throw "Desktop JS parse failed: $source" }
          }
          & npm test
          if ($LASTEXITCODE -ne 0) { throw 'Detached Windows source regression failed' }
          & node --test ci/dev-shell-delta.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Dev shell delta regression failed' }
          & node --test ci/desktop-build-impact.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop NSIS impact regression failed' }
  # Packaging/Native producer changes validate NSIS before merge. An exact
  # shell-only PR runs source/owner tests and saves one duplicate NSIS build;
  # its final main SHA must still pass the full NSIS installation smoke before
  # release. Test-only changes skip identical binaries; unknown impact fails closed.
  windows-installer:
    name: Canonical Windows installer (detached Desktop + OS)
    needs: windows-source
    if: needs.windows-source.outputs.installer_required == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.windows-source.outputs.pr_nsis_required == 'true'))
    uses: ordaxsystems/ordax-os/.github/workflows/windows-desktop-dev.yml@5dd51ee8c7145ca205215f06603b537396f6f714
    with:
      os_sha: 5dd51ee8c7145ca205215f06603b537396f6f714
      desktop_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      # PRs validate the exact NSIS producer without publishing disposable
      # releases. Canonical main pushes and explicit manual recovery dispatches
      # may promote only the bytes rebuilt and verified by this reusable gate.
      publish_dev_release: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      # Required by the pinned reusable OS workflow, even with publish disabled.
      contents: write
